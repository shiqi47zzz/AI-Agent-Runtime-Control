[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-api-guard"
version = "0.1.0"
description = "Pluggable traffic controls for protecting APIs from AI-agent call patterns"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
agent-simulator = "agent_api_guard.simulator:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api_guard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
